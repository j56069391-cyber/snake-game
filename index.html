<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Snake</title>
<style>
  :root { color-scheme: dark; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    background: #0f172a;
    color: #e2e8f0;
    font-family: system-ui, -apple-system, sans-serif;
  }
  h1 { font-size: 1.4rem; letter-spacing: 0.12em; text-transform: uppercase; color: #4ade80; }
  #hud { display: flex; gap: 24px; font-size: 0.95rem; color: #94a3b8; }
  #hud b { color: #e2e8f0; font-variant-numeric: tabular-nums; }
  canvas {
    background: #1e293b;
    border: 2px solid #334155;
    border-radius: 8px;
    touch-action: none;
  }
  #overlay {
    position: absolute;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    background: rgba(15, 23, 42, 0.82);
    border-radius: 8px;
    padding: 24px 40px;
    text-align: center;
  }
  #overlay.hidden { display: none; }
  #overlay h2 { font-size: 1.2rem; margin-bottom: 4px; }
  #overlay p { color: #94a3b8; font-size: 0.9rem; }
  button {
    margin-top: 8px;
    padding: 10px 22px;
    font-size: 1rem;
    font-weight: 600;
    color: #0f172a;
    background: #4ade80;
    border: none;
    border-radius: 6px;
    cursor: pointer;
  }
  button:hover { background: #22c55e; }
  #wrap { position: relative; }
  .hint { color: #64748b; font-size: 0.8rem; }
  @media (max-width: 520px) { canvas { width: 92vw; height: auto; } }
</style>
</head>
<body>
  <h1>Snake</h1>
  <div id="hud">
    <span>Score <b id="score">0</b></span>
    <span>Best <b id="best">0</b></span>
  </div>
  <div id="wrap">
    <canvas id="game" width="400" height="400"></canvas>
    <div id="overlay">
      <h2 id="overlay-title">Snake</h2>
      <p id="overlay-text">Use the arrow keys or swipe to move.</p>
      <button id="start">Play</button>
    </div>
  </div>
  <p class="hint">Arrow keys / WASD on desktop &middot; swipe on mobile</p>

<script>
(() => {
  const GRID = 20, CELL = 20;
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const overlay = document.getElementById('overlay');
  const overlayTitle = document.getElementById('overlay-title');
  const overlayText = document.getElementById('overlay-text');
  const startBtn = document.getElementById('start');

  let snake, dir, nextDir, food, score, best, alive, running;
  let tickMs, timer = null;

  best = Number(localStorage.getItem('snake-best') || 0);
  bestEl.textContent = best;

  function reset() {
    snake = [{x: 9, y: 10}, {x: 8, y: 10}, {x: 7, y: 10}];
    dir = {x: 1, y: 0};
    nextDir = dir;
    score = 0;
    alive = true;
    tickMs = 150;
    placeFood();
    updateHud();
  }

  function placeFood() {
    do {
      food = {
        x: Math.floor(Math.random() * GRID),
        y: Math.floor(Math.random() * GRID)
      };
    } while (snake.some(s => s.x === food.x && s.y === food.y));
  }

  function updateHud() { scoreEl.textContent = score; }

  function step() {
    dir = nextDir;
    const head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};

    const hitWall = head.x < 0 || head.y < 0 || head.x >= GRID || head.y >= GRID;
    const hitSelf = snake.some(s => s.x === head.x && s.y === head.y);
    if (hitWall || hitSelf) return gameOver();

    snake.unshift(head);

    if (head.x === food.x && head.y === food.y) {
      score++;
      updateHud();
      if (score > best) { best = score; bestEl.textContent = best; localStorage.setItem('snake-best', best); }
      placeFood();
      // speed up slightly as the game goes on
      if (tickMs > 70) { tickMs -= 2; restartTimer(); }
    } else {
      snake.pop();
    }
    draw();
  }

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    // food
    ctx.fillStyle = '#f87171';
    ctx.beginPath();
    ctx.arc(food.x * CELL + CELL / 2, food.y * CELL + CELL / 2, CELL / 2 - 2, 0, Math.PI * 2);
    ctx.fill();
    // snake
    snake.forEach((s, i) => {
      ctx.fillStyle = i === 0 ? '#4ade80' : '#22c55e';
      ctx.beginPath();
      ctx.roundRect(s.x * CELL + 1, s.y * CELL + 1, CELL - 2, CELL - 2, 4);
      ctx.fill();
    });
  }

  function gameOver() {
    alive = false;
    stopTimer();
    overlayTitle.textContent = 'Game Over';
    overlayText.textContent = `You scored ${score}.`;
    startBtn.textContent = 'Play again';
    overlay.classList.remove('hidden');
  }

  function restartTimer() { stopTimer(); timer = setInterval(step, tickMs); }
  function stopTimer() { if (timer) { clearInterval(timer); timer = null; } }

  startBtn.addEventListener('click', () => {
    reset();
    overlay.classList.add('hidden');
    restartTimer();
    draw();
  });

  const KEYS = {
    ArrowUp: {x: 0, y: -1}, ArrowDown: {x: 0, y: 1},
    ArrowLeft: {x: -1, y: 0}, ArrowRight: {x: 1, y: 0},
    KeyW: {x: 0, y: -1}, KeyS: {x: 0, y: 1},
    KeyA: {x: -1, y: 0}, KeyD: {x: 1, y: 0},
  };

  document.addEventListener('keydown', (e) => {
    const d = KEYS[e.code];
    if (!d) return;
    e.preventDefault();
    // no reversing into yourself
    if (d.x === -dir.x && d.y === -dir.y) return;
    nextDir = d;
  });

  // touch / swipe controls
  let touchStart = null;
  canvas.addEventListener('touchstart', (e) => {
    touchStart = {x: e.touches[0].clientX, y: e.touches[0].clientY};
  }, {passive: true});
  canvas.addEventListener('touchend', (e) => {
    if (!touchStart) return;
    const dx = e.changedTouches[0].clientX - touchStart.x;
    const dy = e.changedTouches[0].clientY - touchStart.y;
    if (Math.abs(dx) < 20 && Math.abs(dy) < 20) return;
    const d = Math.abs(dx) > Math.abs(dy)
      ? {x: Math.sign(dx), y: 0}
      : {x: 0, y: Math.sign(dy)};
    if (d.x === -dir.x && d.y === -dir.y) return;
    nextDir = d;
    touchStart = null;
  }, {passive: true});

  // preview behind the overlay on load
  reset();
  draw();
})();
</script>
</body>
</html>
